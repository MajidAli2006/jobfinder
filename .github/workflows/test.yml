name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[all,dev]"

      # No API keys and no network access are configured for this job on
      # purpose. The suite must pass on a bare checkout, or it is testing the
      # maintainer's machine rather than the code.
      - name: Test
        run: pytest tests/ -q

      - name: Lint
        run: ruff check job_agent/ tests/ --select F,E9

      # A free-text --query has to be read by the model, and this job has no
      # key, so asking for one here only ever exercised the refusal path — and
      # passed because that path used to exit 0. State the search directly so
      # the pipeline actually runs, and check it produced all four reports.
      - name: Smoke-test the CLI
        shell: bash
        run: |
          cat > candidate.local.json <<'JSON'
          {"default_search": {"label": "Warehouse", "query": "warehouse operative",
                              "core_terms": ["warehouse", "forklift"]}}
          JSON
          jobfinder daily --offline --no-llm --no-open --output-dir "${{ runner.temp }}/smoke"
          for ext in xlsx html csv json; do
            ls "${{ runner.temp }}"/smoke/*.$ext >/dev/null 2>&1 \
              || { echo "no .$ext report was written"; exit 1; }
          done
          echo "all four reports written"

      # The refusal path is the other half of the contract: no key, a free-text
      # query, so no report and a non-zero exit a scheduled run can act on.
      - name: A run that cannot build a search must fail loudly
        shell: bash
        run: |
          rm -f candidate.local.json
          if jobfinder daily --offline --no-llm --no-open \
               --query "warehouse jobs in Leeds" --output-dir "${{ runner.temp }}/refuse"; then
            echo "expected a non-zero exit when no search could be compiled"; exit 1
          fi
          if ls "${{ runner.temp }}"/refuse/* >/dev/null 2>&1; then
            echo "a report was written for a search that could not be built"; exit 1
          fi
          echo "refused correctly, and wrote nothing"

      - name: Smoke-test the MCP server
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | jobfinder-mcp | head -1 | grep -q '"serverInfo"' \
            && echo "MCP server responded" || (echo "MCP server did not respond"; exit 1)
